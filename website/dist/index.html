<style>
/* Layout: macOS-style translucent sidebar on desktop, iOS tab bar on phones; content column ~70rem.
   Apple HIG system colours and grouped-inset surfaces, with Swedish sign yellow kept for brand moments. */
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --fill: rgba(120, 120, 128, 0.12);
  --fill-2: rgba(120, 120, 128, 0.2);
  --label: #1c1c1e;
  --label-2: rgba(60, 60, 67, 0.64);
  --label-3: rgba(60, 60, 67, 0.32);
  --sep: rgba(60, 60, 67, 0.16);
  --blue: #0071e3;
  --blue-tint: rgba(0, 113, 227, 0.1);
  --green: #248a3d;
  --green-bright: #30d158;
  --green-tint: rgba(52, 199, 89, 0.14);
  --red: #d70015;
  --red-tint: rgba(255, 59, 48, 0.12);
  --orange: #c93400;
  --indigo: #5856d6;
  --yellow: #ffcd00;
  --hero: #1c1c1e;
  --hero-label: #ffffff;
  --hero-label-2: rgba(235, 235, 245, 0.62);
  --side: rgba(246, 246, 248, 0.82);
  --bar: rgba(249, 249, 251, 0.86);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.16);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI Variable Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --r-sm: 10px; --r: 16px; --r-lg: 22px;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --fill: rgba(120, 120, 128, 0.24); --fill-2: rgba(120, 120, 128, 0.36);
    --label: #ffffff; --label-2: rgba(235, 235, 245, 0.64); --label-3: rgba(235, 235, 245, 0.3); --sep: rgba(84, 84, 88, 0.55);
    --blue: #0a84ff; --blue-tint: rgba(10, 132, 255, 0.2); --green: #30d158; --green-tint: rgba(48, 209, 88, 0.18);
    --red: #ff453a; --red-tint: rgba(255, 69, 58, 0.2); --orange: #ff9f0a; --indigo: #5e5ce6;
    --hero: #1c1c1e; --side: rgba(28, 28, 30, 0.8); --bar: rgba(22, 22, 24, 0.86);
    --shadow: 0 0 0 1px rgba(255, 255, 255, 0.04); --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --fill: rgba(120, 120, 128, 0.24); --fill-2: rgba(120, 120, 128, 0.36);
  --label: #ffffff; --label-2: rgba(235, 235, 245, 0.64); --label-3: rgba(235, 235, 245, 0.3); --sep: rgba(84, 84, 88, 0.55);
  --blue: #0a84ff; --blue-tint: rgba(10, 132, 255, 0.2); --green: #30d158; --green-tint: rgba(48, 209, 88, 0.18);
  --red: #ff453a; --red-tint: rgba(255, 69, 58, 0.2); --orange: #ff9f0a; --indigo: #5e5ce6;
  --hero: #1c1c1e; --side: rgba(28, 28, 30, 0.8); --bar: rgba(22, 22, 24, 0.86);
  --shadow: 0 0 0 1px rgba(255, 255, 255, 0.04); --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.6); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--label); font: 400 17px/1.47 var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-size: 22px; font-weight: 700; line-height: 1.2; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; text-wrap: pretty; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 60%, transparent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.muted { color: var(--label-2); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.okc { color: var(--green); }
.badc { color: var(--red); }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ico { width: 20px; height: 20px; flex: none; }
.chev { width: 14px; height: 14px; color: var(--label-3); }

/* ---------------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-right: 1px solid var(--sep); padding: 22px 12px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; color: var(--label); }
.brand:hover { text-decoration: none; }
.appicon { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(160deg, #ffe066, #ffcd00 55%, #f5b800); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18), inset 0 0 0 1px rgba(0, 0, 0, 0.08); flex: none; }
.appicon svg { width: 34px; height: 34px; }
.brand b { display: block; font-family: var(--font-display); font-size: 17px; letter-spacing: -0.02em; }
.brand small { display: block; font-size: 12px; color: var(--label-2); }
#me { padding: 0 8px; display: flex; flex-direction: column; gap: 10px; }
#me:empty { display: none; }
.me-row { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px; background: var(--fill); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip .ico { width: 15px; height: 15px; }
.chip.flame { color: var(--label-2); }
.chip.flame.lit { color: #fff; background: linear-gradient(135deg, #ff9f0a, #ff375f); }
.me-level { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--label-2); font-weight: 500; }
.lbar { display: block; height: 6px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.lbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffcd00, #ff9f0a); }
.lbar.big { height: 10px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--label); font-size: 15px; font-weight: 500; min-height: 36px; transition: background 0.15s var(--ease); }
#nav a:hover { background: var(--fill); text-decoration: none; }
#nav a .ico { color: var(--blue); width: 19px; height: 19px; }
#nav a.on { background: var(--blue); color: #fff; }
#nav a.on .ico { color: #fff; }
#nav a span:not(.pill) { flex: 1; }
.pill { background: var(--red); color: #fff; border-radius: 99px; font-size: 12px; font-weight: 600; padding: 1px 7px; font-variant-numeric: tabular-nums; }
#nav a.on .pill { background: #fff; color: var(--blue); }
main { padding-block: 40px 96px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); min-width: 0; }
#main { max-width: 70rem; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
#main.enter { animation: enter 0.38s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.tabbar { display: none; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  main { padding-block: 20px calc(100px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--sep); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; justify-content: center; color: var(--label-2); font-size: 10.5px; font-weight: 600; }
  .tabbar a:hover { text-decoration: none; }
  .tabbar a .ico { width: 24px; height: 24px; }
  .tabbar a.on { color: var(--blue); }
  body.focus .tabbar { display: none; }
  body.focus main { padding-bottom: 32px; }
}

/* ---------------------------------------------------------------- type + common */
.eyebrow { font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: 0.04em; }
.eyebrow a { color: var(--blue); }
.large-title { font-size: clamp(30px, 22px + 2vw, 40px); font-weight: 700; line-height: 1.1; letter-spacing: -0.025em; }
.display { font-size: clamp(40px, 26px + 4.2vw, 72px); font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; max-width: 13ch; }
.lede { font-size: 19px; color: var(--label-2); max-width: 60ch; line-height: 1.45; }
.pagehead { display: flex; flex-direction: column; gap: 8px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding: 0 4px; }
.section-head .muted { font-size: 15px; }
.row-between { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; color: var(--label); }
a.card { transition: transform 0.2s var(--ease); }
a.card:hover { text-decoration: none; transform: translateY(-1px); }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.grid-2.even { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions.center { justify-content: center; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--yellow) 18%, var(--surface)); font-size: 15px; }
.note .ico { color: var(--orange); margin-top: 2px; }
.prose { max-width: 66ch; }
.prose p + p, .prose p + ul, .prose ul + p { margin-top: 12px; }
.prose ul { padding-left: 1.2em; margin: 8px 0 0; }
.prose li + li { margin-top: 6px; }
.tag { align-self: flex-start; background: var(--indigo); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; }

/* buttons: capsules, 44px targets, press shrink */
.btn { font: 600 15px/1 var(--font); letter-spacing: -0.01em; border-radius: 999px; padding: 0 18px; min-height: 40px; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform 0.1s var(--ease), filter 0.15s var(--ease), background 0.15s; white-space: nowrap; }
.btn:hover { text-decoration: none; }
.btn:active:not(:disabled) { transform: scale(0.96); }
.btn.large { min-height: 50px; padding: 0 26px; font-size: 17px; }
.btn.small { min-height: 32px; padding: 0 14px; font-size: 14px; }
.btn .ico { width: 16px; height: 16px; }
.btn.filled { background: var(--blue); color: #fff; }
.btn.filled:hover { filter: brightness(1.08); }
.btn.tinted { background: var(--blue-tint); color: var(--blue); }
.btn.tinted:hover { background: color-mix(in srgb, var(--blue) 18%, transparent); }
.btn.plain { background: transparent; color: var(--blue); }
.btn.plain:hover { background: var(--fill); }
.btn.danger { background: var(--red-tint); color: var(--red); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fill); color: var(--label-2); display: grid; place-items: center; cursor: pointer; flex: none; transition: transform 0.1s; }
.iconbtn:active { transform: scale(0.92); }
.iconbtn .ico { width: 16px; height: 16px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 13px; color: var(--label-2); }
input[type=date], textarea { font: inherit; font-size: 16px; padding: 0 14px; min-height: 44px; border-radius: 12px; border: 0; background: var(--fill); color: var(--label); width: 100%; }
textarea { padding: 12px 14px; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px; }
input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 35%, transparent); }
.row-form { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
.row-form .field { flex: 1 1 180px; }

/* iOS-Settings-style icon tiles */
.tile { width: var(--s); height: var(--s); border-radius: calc(var(--s) * 0.24); background: var(--tile); display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.1); }
.tile .sign { width: 74%; height: 74%; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.25)); }
.tile > span { display: grid; place-items: center; }
.tile .ico { width: calc(var(--s) * 0.56); height: calc(var(--s) * 0.56); }

/* grouped inset lists */
.group { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.group.plain { box-shadow: none; background: transparent; border-radius: 0; }
.row { position: relative; }
.row + .row::before { content: ''; position: absolute; top: 0; right: 0; left: 62px; height: 1px; background: var(--sep); }
.group.plain .row + .row::before { left: 44px; }
.rowlink { display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 56px; color: var(--label); }
.group.plain .rowlink { padding: 10px 0; min-height: 48px; }
a.rowlink:hover { text-decoration: none; background: var(--fill); }
.group.plain a.rowlink:hover { background: transparent; }
.group.plain a.rowlink:hover .rtitle, .group.plain a.rowlink:hover .grow { color: var(--blue); }
.rtitle { font-weight: 500; }
.rsub { font-size: 13px; color: var(--label-2); }
.okdot { width: 22px; height: 22px; border-radius: 50%; background: var(--green-bright); color: #fff; display: grid; place-items: center; flex: none; }
.okdot .ico { width: 13px; height: 13px; stroke-width: 3; }

/* ---------------------------------------------------------------- welcome */
.welcome { position: relative; display: flex; flex-direction: column; gap: 22px; padding-top: 6vh; }
.welcome-art { position: absolute; right: 0; top: 2vh; width: 340px; height: 340px; display: grid; place-items: center; pointer-events: none; }
.welcome-art .rings { filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.18)); }
.float { position: absolute; animation: bob 6s ease-in-out infinite; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.18)); }
.float.s1 { left: 0; top: 30px; } .float.s2 { right: 0; top: 10px; animation-delay: -2s; } .float.s3 { left: 20px; bottom: 10px; animation-delay: -4s; } .float.s4 { right: 24px; bottom: 30px; animation-delay: -1s; }
@keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }
@media (max-width: 980px) { .welcome-art { position: relative; top: 0; width: 280px; height: 280px; margin: 0 auto -10px; } }
.start { flex-direction: row; flex-wrap: wrap; align-items: end; gap: 16px; max-width: 46rem; }
.start .field { flex: 1 1 200px; }
.welcome-lang { gap: 6px; margin-bottom: -6px; position: relative; z-index: 1; }
#langSwitch { gap: 6px; padding: 12px 8px 0; margin-top: auto; }
.facts-strip { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 28px; }
.facts-strip li { display: flex; flex-direction: column; }
.facts-strip b { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.facts-strip span { font-size: 13px; color: var(--label-2); }

/* ---------------------------------------------------------------- today hero (Fitness-style) */
.hero { background: var(--hero); color: var(--hero-label); border-radius: var(--r-lg); padding: 28px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: center; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; inset: auto -20% -60% 30%; height: 120%; background: radial-gradient(closest-side, rgba(10, 132, 255, 0.22), transparent); pointer-events: none; }
.hero-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; z-index: 1; }
.hero-eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #ffd60a; }
.hero-title { font-size: clamp(26px, 20px + 1.6vw, 34px); font-weight: 700; color: #fff; }
.hero-focus { color: var(--hero-label-2); font-size: 16px; max-width: 52ch; }
.legend { list-style: none; margin: 6px 0 4px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 28px; }
.legend li { display: flex; flex-direction: column; }
.legend b { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.15; }
.legend span { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: var(--hero-label-2); }
.btn.hero-cta { align-self: flex-start; margin-top: 6px; background: #fff; color: #000; max-width: 100%; }
.btn.hero-cta:hover { filter: none; background: #f2f2f7; }
.hero-cta .ico { width: 14px; height: 14px; }
.hero-done { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: #fff; font-weight: 500; }
.hero-done > .ico { color: var(--green-bright); }
.hero-done .btn.tinted { background: rgba(255, 255, 255, 0.14); color: #fff; }
@media (max-width: 640px) { .hero { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; padding: 24px 20px; gap: 18px; } .hero-body { align-items: center; } .legend { justify-content: center; } .hero-cta { align-self: center; white-space: normal; } }
.rings .ring { animation: ringfill 1.2s var(--ease) both; }
@keyframes ringfill { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: var(--off); } }

/* journey: 30 day dots */
.journey { display: flex; flex-direction: column; gap: 8px; padding-top: 20px; }
.jtrack { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 5px; align-items: center; }
.jd { position: relative; height: 12px; border-radius: 99px; background: var(--fill-2); transition: transform 0.2s var(--spring); }
.jd:hover { transform: scaleY(1.5); }
.jd.done { background: var(--green-bright); }
.jd.mock:not(.done) { background: color-mix(in srgb, var(--indigo) 40%, var(--fill-2)); }
.jd.late { background: color-mix(in srgb, #ff9f0a 55%, var(--fill-2)); }
.jd.now { background: var(--blue); height: 18px; }
.jcar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); color: var(--blue); }
.jcar .ico { width: 22px; height: 22px; }
.jlabels { display: flex; justify-content: space-between; font-size: 12px; color: var(--label-2); font-weight: 500; }

/* tasks */
.tasks .task { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; }
.tasks .row + .row::before { left: 100px; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--label-3); background: transparent; color: transparent; cursor: pointer; padding: 0; display: grid; place-items: center; flex: none; transition: all 0.25s var(--spring); }
.check .ico { width: 15px; height: 15px; stroke-width: 3; }
.check:hover { border-color: var(--green-bright); }
.task.done .check { background: var(--green-bright); border-color: var(--green-bright); color: #fff; transform: scale(1.06); }
.tbody { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tlabel { font-weight: 500; line-height: 1.3; }
.tsub { font-size: 13px; color: var(--label-2); }
.task.done .tlabel { color: var(--label-2); }
@media (max-width: 520px) { .tasks .task .tile { display: none; } .tasks .row + .row::before { left: 56px; } }
.teaser { gap: 4px; }
.teaser b { font-family: var(--font-display); font-size: 20px; letter-spacing: -0.02em; }

/* streak + level + readiness */
.streak-card { gap: 16px; }
.streak-top { display: flex; align-items: center; gap: 14px; }
.streak-top > div { display: flex; flex-direction: column; }
.flame-big { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--fill); color: var(--label-3); flex: none; }
.flame-big .ico { width: 30px; height: 30px; }
.flame-big.lit { background: linear-gradient(135deg, #ffcc00, #ff9f0a 45%, #ff375f); color: #fff; box-shadow: 0 6px 18px rgba(255, 111, 0, 0.35); animation: flicker 2.4s ease-in-out infinite; }
@keyframes flicker { 50% { transform: scale(1.05) rotate(-2deg); } }
.big { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.big-num { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.week-strip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week-strip li { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--label-2); font-weight: 600; }
.week-strip i { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: #fff; }
.week-strip i .ico { width: 15px; height: 15px; stroke-width: 3; }
.week-strip li.on i { background: linear-gradient(135deg, #ff9f0a, #ff375f); }
.week-strip li.now span { color: var(--label); }
.week-strip li.now i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--blue); }
.meter { position: relative; height: 10px; border-radius: 99px; background: var(--fill); }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, #0a84ff, #30d158); }
.meter em { position: absolute; top: -5px; bottom: -5px; width: 3px; border-radius: 2px; background: var(--label); }
.badges-mini { gap: 14px; }
.badge-row { display: flex; gap: 10px; flex-wrap: wrap; }
.medal { width: var(--m); height: var(--m); border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--label-3); flex: none; }
.medal .ico { width: 48%; height: 48%; }
.medal.on { background: radial-gradient(circle at 30% 25%, #fff3b0, #ffcd00 45%, #e09b00); color: #6b4a00; box-shadow: 0 3px 10px rgba(224, 155, 0, 0.4), inset 0 0 0 2px rgba(255, 255, 255, 0.5); }

/* ---------------------------------------------------------------- plan */
.week { display: flex; flex-direction: column; gap: 12px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
.day { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); color: var(--label); min-height: 132px; transition: transform 0.2s var(--spring), box-shadow 0.2s; }
.day:hover { text-decoration: none; transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.day-top { display: flex; justify-content: space-between; align-items: flex-start; }
.dnum { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: -0.03em; }
.ddate { font-size: 12px; color: var(--label-2); font-weight: 500; }
.dtitle { font-weight: 600; font-size: 15px; line-height: 1.3; flex: 1; }
.day.now { box-shadow: 0 0 0 2.5px var(--blue), var(--shadow-lg); }
.day.now .dnum { color: var(--blue); }
.day.done .dnum { color: var(--green); }
.day.future { opacity: 0.86; }
.day.late .ddate { color: var(--orange); }
.day .tag { margin-top: 4px; }
.pager { display: flex; justify-content: space-between; gap: 10px; }

/* ---------------------------------------------------------------- lessons */
.feature { flex-direction: row; align-items: center; gap: 14px; }
.feature > div { flex: 1; display: flex; flex-direction: column; }
.lesson { display: flex; flex-direction: column; gap: 32px; max-width: 46rem; }
.lesson-head .tile { margin-bottom: 6px; }
.lsec { display: flex; flex-direction: column; gap: 12px; }
.lsec .prose { font-size: 17px; line-height: 1.6; }
.pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pic { margin: 0; background: var(--surface); border-radius: var(--r); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: var(--shadow); }
.pic svg.scene { width: 100%; height: auto; display: block; border-radius: 10px; }
.pic figcaption { font-size: 13px; color: var(--label-2); padding: 0 6px 4px; }
.scene-sign { display: flex; justify-content: center; padding: 22px; }
.scene-sign .sign { filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.16)); }
.scene-signs { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; padding: 16px; }
.scene-signs figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.scene-signs figcaption { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.keyfacts { background: color-mix(in srgb, var(--yellow) 14%, var(--surface)); }
.keyfacts ul, .factsgrid ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.factsgrid { columns: 2 22rem; column-gap: 16px; }
.factsgrid .card { break-inside: avoid; margin-bottom: 16px; }
.facts-h { display: flex; align-items: center; gap: 10px; color: var(--label); }
.facts-h h2 { font-size: 19px; }

/* ---------------------------------------------------------------- practice hub */
.hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.hubcard { font: inherit; text-align: left; border: 0; cursor: pointer; border-radius: var(--r-lg); padding: 18px; min-height: 148px; display: flex; flex-direction: column; gap: 2px; color: #fff; background: var(--c1); background-image: linear-gradient(150deg, var(--c1), var(--c2)); box-shadow: var(--shadow); transition: transform 0.2s var(--spring), box-shadow 0.2s; }
.hubcard:hover { transform: translateY(-3px) scale(1.01); box-shadow: var(--shadow-lg); text-decoration: none; }
.hubcard:active { transform: scale(0.97); }
.hubcard > span { width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, 0.22); display: grid; place-items: center; margin-bottom: auto; }
.hubcard b { font-family: var(--font-display); font-size: 21px; letter-spacing: -0.02em; margin-top: 16px; }
.hubcard em { font-style: normal; font-size: 13px; opacity: 0.86; }
.c-blue { --c1: #0a84ff; --c2: #0040dd; } .c-orange { --c1: #ff9f0a; --c2: #ff6a00; } .c-indigo { --c1: #7d7aff; --c2: #4b44d4; } .c-pink { --c1: #ff5a7a; --c2: #e0213f; }
.c-yellow { --c1: #ffd60a; --c2: #ffb300; color: #2b2100; } .c-yellow > span { background: rgba(0, 0, 0, 0.1); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
legend { font-weight: 600; font-size: 13px; color: var(--label-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip input, .seg input { position: absolute; opacity: 0; pointer-events: none; }
label.chip { padding: 0; background: none; }
label.chip span { display: inline-flex; gap: 6px; padding: 0 14px; min-height: 36px; align-items: center; border-radius: 99px; background: var(--fill); cursor: pointer; font-size: 15px; font-weight: 500; transition: background 0.15s; }
label.chip span em { font-style: normal; font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; }
label.chip input:checked + span { background: var(--blue); color: #fff; }
label.chip input:checked + span em { color: rgba(255, 255, 255, 0.8); }
label.chip input:focus-visible + span, .seg input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--blue) 60%, transparent); outline-offset: 2px; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--fill); padding: 2px; border-radius: 10px; align-self: flex-start; }
.seg span { display: block; padding: 7px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg input:checked + span { background: var(--surface); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }

/* ---------------------------------------------------------------- quiz */
.quiz { display: flex; flex-direction: column; gap: 18px; }
.qbar { display: flex; align-items: center; gap: 14px; }
.qprog { flex: 1; height: 8px; background: var(--fill); border-radius: 99px; overflow: hidden; }
.qprog i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #30d158, #0a84ff); transition: width 0.4s var(--ease); }
.combo { display: flex; align-items: center; gap: 4px; font-weight: 700; color: var(--label-3); font-variant-numeric: tabular-nums; min-width: 48px; justify-content: flex-end; }
.combo .ico { width: 20px; height: 20px; }
.combo.hot { color: #ff6a00; animation: pop 0.4s var(--spring); }
@keyframes pop { 40% { transform: scale(1.3); } }
.timer { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--fill); padding: 6px 12px; border-radius: 10px; min-width: 76px; text-align: center; }
.timer.low { background: var(--red); color: #fff; }
.qgrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.qgrid.noimg { grid-template-columns: minmax(0, 44rem); justify-content: center; }
@media (max-width: 920px) { .qgrid { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
.qpic { position: sticky; top: 20px; padding: 10px; border-radius: var(--r-lg); }
.qpic svg.scene { border-radius: 14px; }
@media (max-width: 920px) { .qpic { position: static; } }
.qside { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qtext { font-family: var(--font-display); font-size: clamp(21px, 18px + 0.6vw, 26px); font-weight: 700; line-height: 1.28; letter-spacing: -0.02em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; font: 500 16px/1.4 var(--font); color: var(--label); background: var(--surface); border: 2px solid transparent; border-radius: 14px; padding: 13px 16px; min-height: 58px; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.12s var(--ease), border-color 0.15s, background 0.15s; }
.opt:hover:not(:disabled) { border-color: color-mix(in srgb, var(--blue) 45%, transparent); }
.opt:active:not(:disabled) { transform: scale(0.98); }
.letter { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--fill); color: var(--label-2); flex: none; transition: all 0.25s var(--spring); }
.letter .ico { width: 16px; height: 16px; stroke-width: 3; }
.opt.picked { border-color: var(--blue); background: var(--blue-tint); }
.opt.picked .letter { background: var(--blue); color: #fff; }
.opt.right { border-color: var(--green-bright); background: var(--green-tint); }
.opt.right .letter { background: var(--green-bright); color: #fff; transform: scale(1.12); }
.opt.wrong { border-color: var(--red); background: var(--red-tint); animation: shake 0.4s var(--ease); }
.opt.wrong .letter { background: var(--red); color: #fff; }
.opt.dim { opacity: 0.5; }
.opt:disabled { cursor: default; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.feedback { padding: 16px 18px; border-radius: 14px; display: flex; flex-direction: column; gap: 4px; animation: rise 0.35s var(--spring); }
.feedback b { font-size: 17px; }
.feedback.ok { background: var(--green-tint); } .feedback.ok b { color: var(--green); }
.feedback.bad { background: var(--red-tint); } .feedback.bad b { color: var(--red); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
.qnav { display: flex; justify-content: space-between; gap: 10px; }
.qnav .btn.filled { margin-left: auto; min-width: 160px; }
@media (max-width: 920px) { .qnav { position: sticky; bottom: 12px; } .qnav .btn.filled { flex: 1; box-shadow: var(--shadow-lg); } }
.keys { margin-top: -4px; }
@media (hover: none), (max-width: 920px) { .keys { display: none; } }
.qmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; padding-top: 14px; border-top: 1px solid var(--sep); }
.qmap button { font: 600 13px/1 var(--font); min-height: 36px; border-radius: 10px; border: 0; background: var(--fill); color: var(--label); cursor: pointer; font-variant-numeric: tabular-nums; }
.qmap button.ans { background: var(--blue); color: #fff; }
.qmap button.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--label); }

/* ---------------------------------------------------------------- results */
.result { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-top: 10px; }
.result .lede { margin-inline: auto; }
.result-ring { position: relative; display: grid; place-items: center; margin-bottom: 6px; }
.result-ring > span { position: absolute; display: flex; flex-direction: column; align-items: center; }
.result-ring b { font-family: var(--font-display); font-size: 48px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.result-ring b small { font-size: 22px; color: var(--label-2); font-weight: 600; }
.result-ring em { font-style: normal; color: var(--label-2); font-weight: 600; }
.rewards { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 4px 0 8px; }
.reward { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 99px; background: color-mix(in srgb, var(--yellow) 26%, var(--surface)); font-size: 15px; animation: rise 0.5s var(--spring) both; }
.reward:nth-child(2) { animation-delay: 0.15s; } .reward:nth-child(3) { animation-delay: 0.3s; } .reward:nth-child(4) { animation-delay: 0.45s; }
.reward .ico { width: 17px; height: 17px; color: #e09b00; }
.reward.day { background: var(--green-tint); } .reward.day .ico { color: var(--green); }
.mlist { display: flex; flex-direction: column; gap: 12px; }
.mitem summary { cursor: pointer; font-weight: 500; display: flex; gap: 12px; align-items: center; list-style: none; }
.mitem summary::-webkit-details-marker { display: none; }
.mitem[open] summary .chev { transform: rotate(90deg); }
.mitem .pic { max-width: 440px; box-shadow: none; background: var(--fill); }
.mitem.open h3 { font-size: 18px; }
.ans { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
.ans .ico { width: 18px; height: 18px; margin-top: 3px; stroke-width: 3; }
.ans.ok { color: var(--green); } .ans.bad { color: var(--red); }
.empty { align-items: flex-start; }

/* ---------------------------------------------------------------- signs */
.signgroup { display: flex; flex-direction: column; gap: 12px; }
.signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.signcard { position: relative; font: inherit; color: var(--label); background: var(--surface); border: 0; border-radius: var(--r); padding: 16px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; min-height: 158px; box-shadow: var(--shadow); transition: transform 0.25s var(--spring); }
.signcard:hover { transform: translateY(-3px); }
.signcard .sign { transition: transform 0.35s var(--spring); }
.signcard:hover .sign { transform: scale(1.06) rotate(-2deg); }
.signcard .sname { font-size: 13px; font-weight: 500; text-align: center; line-height: 1.3; opacity: 0; transform: translateY(4px); transition: all 0.25s var(--ease); }
.signcard::after { content: 'Tap to reveal'; position: absolute; bottom: 14px; font-size: 12px; color: var(--label-3); transition: opacity 0.2s; }
.signcard.on .sname { opacity: 1; transform: none; }
.signcard.on::after { opacity: 0; }
.signcard .okdot { position: absolute; top: 10px; right: 10px; }

/* ---------------------------------------------------------------- progress */
.stats { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stats li { background: var(--surface); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.stats b { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; color: var(--c); font-variant-numeric: tabular-nums; }
.stats b small { font-size: 18px; color: var(--label-3); }
.stats span { color: var(--label-2); font-size: 13px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 12px; }
.badge-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.badge-item b { font-size: 14px; }
.badge-item span { font-size: 12px; color: var(--label-2); line-height: 1.35; }
.badge-item:not(.on) b { color: var(--label-2); }
.mbar { display: block; height: 5px; border-radius: 99px; background: var(--fill); overflow: hidden; margin-top: 6px; max-width: 320px; }
.mbar i { display: block; height: 100%; background: var(--green-bright); border-radius: 99px; }
.mock-card { align-items: flex-start; }
.mock-dial { position: relative; display: grid; place-items: center; }
.mock-dial > span { position: absolute; display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--label-2); font-weight: 600; }
.mock-dial b { font-family: var(--font-display); font-size: 30px; color: var(--label); line-height: 1; }
.tablewrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--label-2); padding: 6px 10px; border-bottom: 1px solid var(--sep); font-weight: 600; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--sep); }
.tbl td.num, .tbl th:nth-child(2), .tbl th:nth-child(3) { text-align: right; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.badge.ok { background: var(--green-tint); color: var(--green); }
.badge.bad { background: var(--red-tint); color: var(--red); }
.chart { width: 100%; min-width: 420px; height: auto; }
.chart .grid { stroke: var(--sep); }
.chart .axis { fill: var(--label-2); font-size: 11px; font-family: var(--font); }
.chart .pass { stroke: var(--label); stroke-dasharray: 4 5; opacity: 0.6; }
.chart .area { fill: var(--blue); opacity: 0.1; }
.chart .line { fill: none; stroke: var(--blue); stroke-width: 2.5; stroke-linejoin: round; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .dot.ok { fill: var(--green-bright); } .chart .dot.bad { fill: var(--red); }

/* ---------------------------------------------------------------- sync + reminders */
input.text { font: inherit; font-size: 16px; padding: 0 14px; min-height: 44px; border-radius: 12px; border: 0; background: var(--fill); color: var(--label); width: 100%; letter-spacing: 0.04em; }
.codebox { display: flex; flex-direction: column; gap: 8px; }
.code { font: 600 20px/1.2 ui-monospace, 'SF Mono', Consolas, monospace; letter-spacing: 0.08em; padding: 14px 16px; border-radius: 12px; background: var(--fill); text-align: center; user-select: all; overflow-wrap: anywhere; }
.syncdot { width: 10px; height: 10px; border-radius: 50%; background: var(--label-3); flex: none; align-self: center; }
.syncdot.ok { background: var(--green-bright); } .syncdot.syncing { background: #ff9f0a; animation: flicker 1s infinite; } .syncdot.error { background: var(--red); }
.steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.promo { flex-direction: row; align-items: center; gap: 12px; }
.promo .grow b { font-size: 15px; }

/* ---------------------------------------------------------------- overlays */
#toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--label); padding: 12px 18px; border-radius: 99px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow-lg); z-index: 50; max-width: calc(100% - 32px); }
#toast .ico { color: var(--green-bright); }
#toast.in { animation: drop 0.45s var(--spring); }
@keyframes drop { from { opacity: 0; transform: translate(-50%, -20px) scale(0.95); } }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.4); display: grid; place-items: center; padding: 20px; animation: fade 0.25s var(--ease); }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--surface); border-radius: 26px; padding: 32px 28px 24px; max-width: 360px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; box-shadow: var(--shadow-lg); animation: rise 0.45s var(--spring); }
.sheet h2 { font-size: 26px; margin-top: 8px; }
.sheet .btn { width: 100%; margin-top: 10px; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ---------------------------------------------------------------- phones
   Tighter spacing, smaller art and a quiz that fits one screen: picture, question and answers
   are visible together, and the Continue bar has its own backdrop instead of floating over text. */
@media (max-width: 640px) {
  #main { gap: 18px; }
  main { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
  .large-title { font-size: 28px; }
  .lede { font-size: 16px; }
  .card { padding: 16px; }
  .grid-2, .stack { gap: 14px; }

  /* welcome: art shrinks so the start form is on the first screen */
  .welcome { padding-top: 0; gap: 16px; }
  .welcome-art { width: 168px; height: 168px; margin: 0 auto -6px; }

<script>/* i18n.js */
/*
 * Language support. English is the source text in topics.js, plan.js, questions/ and lessons/.
 * Swedish lives in sv/ as overlays keyed by the same ids, and replaces the English text in place
 * at start-up when the chosen language is Swedish. Switching language saves the choice and reloads.
 *
 *   SV.q({ 'turning-01': { q, options: [...same order...], explain } })
 *   SV.lessons.people = { title, intro, sections: [{ h, body }, ...same order...], keyFacts: [...] }
 *   SV.plan = { 1: { title, focus, goal, tasks: { 0: { text, label } } }, ... }
 *   SV.topics = { signs: { name, short } }
 *   SV.signs = { yield: 'Väjningsplikt', ... }
 *   SV.labels = { 'Give way': 'Väjningsplikt' }   word captions under lesson pictures, keyed by the English text
 *   UI strings: STRINGS in strings.js, read with T('key', { n: 3 }).
 */
(function () {
  const KEY = 'korkort30.lang';
  let lang = 'sv';
  try { const v = localStorage.getItem(KEY); if (v === 'en' || v === 'sv') lang = v; } catch {}
  window.LANG = lang;
  document.documentElement.lang = lang;

  const SV = window.SV = { qs: {}, lessons: {}, plan: {}, topics: {}, signs: {}, labels: {} };
  SV.q = (o) => Object.assign(SV.qs, o);

  window.STRINGS = window.STRINGS || {};
  /** UI text for the current language. `{name}` placeholders are filled from vars; a value may also be a function of vars. */
  window.T = (key, vars = {}) => {
    const e = window.STRINGS[key];
    if (!e) return key;
    let s = e[lang] ?? e.en;
    if (typeof s === 'function') return s(vars);
    return String(s).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  };

  window.I18N = {
    lang,
    locale: lang === 'sv' ? 'sv-SE' : 'en-GB',
    you: lang === 'sv' ? 'DU' : 'YOU',
    set(next) {
      if (next === lang) return;
      try { localStorage.setItem(KEY, next); } catch {}
      location.reload();
    },
    /** Swap the English content for Swedish. Runs once, after every content file has loaded. */
    apply() {
      if (lang !== 'sv') return;
      for (const t of window.TOPICS || []) Object.assign(t, SV.topics[t.id] || {});
      for (const q of window.QB || []) {
        const s = SV.qs[q.id];
        if (!s) continue;
        if (s.q) q.q = s.q;
        if (s.explain) q.explain = s.explain;
        if (Array.isArray(s.options) && s.options.length === q.options.length) q.options = s.options.slice();
      }
      for (const [id, l] of Object.entries(window.LESSONS || {})) {
        const s = SV.lessons[id];
        if (!s) continue;
        for (const k of ['title', 'intro']) if (s[k]) l[k] = s[k];
        if (Array.isArray(s.keyFacts) && s.keyFacts.length) l.keyFacts = s.keyFacts.slice();
        (s.sections || []).forEach((sec, i) => { if (l.sections[i] && sec) Object.assign(l.sections[i], { h: sec.h || l.sections[i].h, body: sec.body || l.sections[i].body }); });
      }
      for (const l of Object.values(window.LESSONS || {}))
        for (const sec of l.sections || []) for (const p of sec.pics || []) if (p.labels) p.labels = p.labels.map((t) => SV.labels[t] || t);
      for (const d of window.PLAN || []) {
        const s = SV.plan[d.day];
        if (!s) continue;
        for (const k of ['title', 'focus', 'goal']) if (s[k]) d[k] = s[k];
        for (const [i, t] of Object.entries(s.tasks || {})) if (d.tasks[i]) for (const k of ['text', 'label']) if (t[k] && d.tasks[i][k]) d.tasks[i][k] = t[k];
      }
      if (window.Signs) {
        const name = window.Signs.name;
        window.Signs.name = (n) => SV.signs[n] || name(n);
      }
    },
  };
})();

</script>
